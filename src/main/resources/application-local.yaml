spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  security:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://127.0.0.1:3000
        - http://localhost:5173
        - http://127.0.0.1:5173
        - http://localhost:4173
        - http://127.0.0.1:4173
    public-paths:
      - /error
      - /api/draw/**
      - /actuator/health
      - /actuator/info
      - /swagger-ui/**
      - /v3/api-docs/**
