spring:
  application:
    name: luckydrop-api
  datasource:
    url: ${DB_URL}?reWriteBatchedInserts=true&prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    root: INFO
    com.luckydrop.api: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    public-paths:
      - /error
      - /api/draw/**
      - /actuator/health
      - /actuator/info
