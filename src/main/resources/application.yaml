spring:
  application:
    name: luckydrop-api
  datasource:
    url: ${DB_URL}?reWriteBatchedInserts=true&prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

logging:
  level:
    root: INFO
    com.luckydrop.api: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    draw-rate-limit:
      enabled: true
      trust-x-forwarded-for: false
      window: 1m
      bucket-cache-max-size: 100000
      ip-per-minute: 120
      ip-content-per-minute: 30
      ip-content-invitation-per-minute: 10
      execute-ip-content-per-minute: 10
    public-paths:
      - /error
      - /api/draw/**
      - /actuator/health
      - /actuator/info
